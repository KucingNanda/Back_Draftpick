basePath: /
definitions:
  model.Bgm:
    properties:
      id:
        type: integer
      nama:
        type: string
      url:
        type: string
    type: object
  model.History:
    properties:
      created_at:
        type: string
      draftData:
        description: Berisi JSON DraftState
        type: string
      id:
        type: integer
      playerA:
        type: string
      playerB:
        type: string
      role:
        description: '"wasit" atau "peserta"'
        type: string
      updated_at:
        type: string
    type: object
  model.Karakter:
    properties:
      cost:
        description: 0 atau 1
        type: integer
      id:
        type: integer
      imageUrl:
        description: Link Cloudinary
        type: string
      nama:
        type: string
      rarity:
        description: 4 Star, 5 Star Limited, dll
        type: string
      senjata:
        description: Sword, Claymore, Catalyst, Bow, Polearm
        type: string
      vision:
        description: Anemo, Geo, Electro, Dendro, Hydro, Pyro, Cryo, Flex
        type: string
    type: object
  model.Peserta:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      karakters:
        items:
          $ref: '#/definitions/model.PesertaKarakter'
        type: array
      nama:
        type: string
      updatedAt:
        type: string
    type: object
  model.PesertaKarakter:
    properties:
      id:
        type: integer
      isC1:
        type: boolean
      karakter:
        $ref: '#/definitions/model.Karakter'
      karakterId:
        type: integer
      pesertaId:
        type: integer
    type: object
  model.Settings:
    properties:
      bgmUrl:
        type: string
      free4StarHalf:
        type: string
      free4StarId:
        type: integer
      id:
        type: integer
      maxCost:
        type: integer
    type: object
  model.User:
    properties:
      id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
host: 127.0.0.1:3000
